<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1200" height="780" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#3a4a5c"/></marker><marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#9aa7b4"/></marker></defs><rect x="50" y="55" width="250" height="50" rx="9" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.6"/><text x="175" y="79" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Accuracy target  ε</text><text x="175" y="99" font-size="12.5" fill="#45566a" text-anchor="middle">(user input)</text><rect x="50" y="275" width="250" height="50" rx="9" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.6"/><text x="175" y="299" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Trust signal  τ(t)</text><text x="175" y="319" font-size="12.5" fill="#45566a" text-anchor="middle">from Module 1</text><rect x="50" y="148" width="250" height="64" rx="9" fill="#f8dfa0" stroke="#c1841a" stroke-width="1.6"/><text x="175" y="172" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Accuracy-budget map</text><text x="175" y="192" font-size="12.5" fill="#45566a" text-anchor="middle">thresholds_for_target</text><text x="175" y="209" font-size="12.5" fill="#45566a" text-anchor="middle">ε  →  threshold θlo</text><path d="M 175 105 L 175 148" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="360" y="120" width="700" height="300" rx="14" fill="#fdf6e6" stroke="#c1841a" stroke-width="1.6"/><text x="380" y="152" font-size="16" font-weight="700" fill="#8a5a10">Adaptive controller — decision state machine</text><rect x="430" y="213" width="180" height="74" rx="9" fill="#ffffff" stroke="#3f9d54" stroke-width="2.0"/><text x="520" y="237" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">TRUST  ML</text><text x="520" y="257" font-size="12.5" fill="#45566a" text-anchor="middle">keep the cheap</text><text x="520" y="274" font-size="12.5" fill="#45566a" text-anchor="middle">surrogate step</text><rect x="790" y="213" width="180" height="74" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="880" y="237" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">CORRECTING</text><text x="880" y="257" font-size="12.5" fill="#45566a" text-anchor="middle">invoke numerical</text><text x="880" y="274" font-size="12.5" fill="#45566a" text-anchor="middle">correction (M2)</text><path d="M 612 250 L 788 250" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="664" y="227" width="73" height="16" rx="3" fill="white"/><text x="700" y="238" font-size="11" font-style="italic" fill="#5a6b7d" text-anchor="middle">trust &lt; θlo</text><path d="M 788 300 L 612 300" fill="none" stroke-width="1.7" stroke="#9aa7b4" stroke-dasharray="6 4" marker-end="url(#d)"/><rect x="528" y="309" width="343" height="16" rx="3" fill="white"/><text x="700" y="320" font-size="11" font-style="italic" fill="#9aa7b4" text-anchor="middle">trust &gt; θhi   (hysteresis: implemented, not shipped)</text><text x="710" y="400" font-size="12" fill="#8a5a10" text-anchor="middle" font-style="italic">Shipped design: one-way latch (θhi set beyond the trust range, so it never releases)</text><path d="M 300 180 L 480 180 L 480 214" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="420" y="159" width="20" height="16" rx="3" fill="white"/><text x="430" y="170" font-size="11" font-style="italic" fill="#5a6b7d" text-anchor="middle">θlo</text><path d="M 300 300 L 520 300 L 520 289" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="344" y="279" width="33" height="16" rx="3" fill="white"/><text x="360" y="290" font-size="11" font-style="italic" fill="#5a6b7d" text-anchor="middle">trust</text><path d="M 710 420 L 710 466" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="644" y="434" width="132" height="16" rx="3" fill="white"/><text x="710" y="445" font-size="11" font-style="italic" fill="#5a6b7d" text-anchor="middle">correct?  (per step)</text><rect x="330" y="497" width="760" height="86" rx="9" fill="#ffffff" stroke="#3a4a5c" stroke-width="1.6"/><text x="710" y="521" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Deployment runtime  —  HybridRuntime.run(IC, ε)</text><text x="710" y="541" font-size="12.5" fill="#45566a" text-anchor="middle">For each time step: read the trust signal, ask the controller, then keep the cheap ML prediction</text><text x="710" y="558" font-size="12.5" fill="#45566a" text-anchor="middle">or hand the state to Module 2 for numerical correction; count ML vs numerical steps and time.</text><rect x="50" y="508" width="250" height="64" rx="9" fill="#f8dfa0" stroke="#c1841a" stroke-width="1.6"/><text x="175" y="532" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Cost profiler</text><text x="175" y="552" font-size="12.5" fill="#45566a" text-anchor="middle">per-step ML &amp; numerical</text><text x="175" y="569" font-size="12.5" fill="#45566a" text-anchor="middle">cost rates</text><path d="M 300 540 L 330 540" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><rect x="410" y="673" width="300" height="54" rx="9" fill="#ffffff" stroke="#3a4a5c" stroke-width="1.6"/><text x="560" y="705" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Solution field  u(x, t)</text><rect x="740" y="673" width="320" height="54" rx="9" fill="#ffffff" stroke="#3a4a5c" stroke-width="1.6"/><text x="900" y="697" font-size="15" font-weight="700" fill="#20303f" text-anchor="middle">Cost report</text><text x="900" y="717" font-size="12.5" fill="#45566a" text-anchor="middle">time · calls · speed-up</text><path d="M 640 583 L 640 673" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/><path d="M 900 583 L 900 673" fill="none" stroke-width="1.7" stroke="#3a4a5c" marker-end="url(#a)"/></svg>