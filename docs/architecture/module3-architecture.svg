ily="Helvetica, Arial, sans-serif">module boundary</text><text x="40" y="946" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Fig. 1.</text><text x="98" y="946" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">High-level architecture of Module M3 — cost-aware adaptive control and deployment of the hybrid ML–numerical PDE solver.</text><text x="40" y="968" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Blocks C1–C6 (plan components 14–19) are M3 contributions; gray blocks are shared Phase-1 infrastructure and sibling modules M1/M2, consumed through fixed interfaces.</text><text x="40" y="990" font-size="13" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">Solid arrows denote data / control flow; dashed arrows denote evaluation-only paths that never enter the online solver.</text></svg>